<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nika Ciemats | Latviešu Draudzīgākā Discord Komūna</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        /* Fona krāsa precīzi #202020 kā prasīji */
        body {
            background-color: #202020;
            color: #ffffff;
            font-family: 'Arial Black', 'Arial', sans-serif; /* Resni, izteiksmīgi burti kā skicē */
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Navigācijas josla (Header) - Melna, fiksēta augšā */
        header {
            background-color: #000000;
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 40px;
            position: relative;
            box-sizing: border-box;
        }

        /* Mazais logo kreisajā malā */
        .logo-left-container {
            position: absolute;
            left: 40px;
            display: flex;
            align-items: center;
        }

        .logo-small {
            height: 35px;
            width: auto;
        }

        /* Centrētā izvēlne tieši tāpat kā attēlā */
        nav {
            display: flex;
            gap: 35px;
            margin: 0 auto; /* Šis nocentrē visu pogu bloku pa vidu */
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 900;
            font-size: 14px;
            text-transform: uppercase;
            font-family: 'Arial', sans-serif;
            letter-spacing: 0.5px;
            transition: opacity 0.2s;
        }

        nav a:hover {
            opacity: 0.7;
        }

        /* Galvenais satura izkārtojums (Hero) */
        .hero-container {
            max-width: 1200px;
            margin: 120px auto 0 auto;
            padding: 0 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }

        /* Kreisā puse ar tekstiem */
        .hero-text-block {
            flex: 1;
            text-align: left;
        }

        /* "Latviešu" ar sarkano krāsu un biezajiem burtiem */
        .text-latviesu {
            color: #b71c1c; 
            font-size: 52px;
            font-weight: 900;
            line-height: 1;
            margin: 0;
        }

        /* "DRAUDZĪGĀKĀ" ar biezāko balto līniju apakšā */
        .text-draudzigaka {
            font-size: 64px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.1;
            margin: 5px 0;
            display: inline-block;
            border-bottom: 7px solid #ffffff; /* Izteiksmīga līnija apakšā */
            padding-bottom: 5px;
        }

        /* "Discord Komūna" */
        .text-komuna {
            font-size: 58px;
            font-weight: 900;
            line-height: 1.1;
            margin: 15px 0 40px 0;
        }

        /* Baltā poga "PIEVIENOTIES TAGAD!" ar noapaļotiem stūriem */
        .btn-join-now {
            display: inline-block;
            background-color: #ffffff;
            color: #000000;
            padding: 18px 55px;
            font-size: 22px;
            font-weight: 900;
            text-decoration: none;
            border-radius: 20px; /* Noapaļotie stūri pēc skices */
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.2s;
        }

        .btn-join-now:hover {
            transform: scale(1.03);
        }

        /* Labā puse - Lielais ūsu logotips */
        .hero-image-block {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .large-logo-img {
            max-width: 100%;
            height: auto;
            width: 420px; /* Precīzs izmērs, lai atbilstu proporcijām */
        }

        /* MOBILĀS VERSIJAS AUTOMĀTISKAIS SCALING */
        @media (max-width: 950px) {
            header {
                height: auto;
                padding: 20px;
                flex-direction: column;
                gap: 15px;
            }

            .logo-left-container {
                position: static;
                margin-bottom: 5px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px 25px;
            }

            .hero-container {
                flex-direction: column-reverse;
                margin-top: 40px;
                padding: 0 20px;
                text-align: center;
                gap: 40px;
            }

            .hero-text-block {
                text-align: center;
            }

            .text-latviesu { font-size: 38px; }
            .text-draudzigaka { font-size: 44px; border-bottom-width: 5px; }
            .text-komuna { font-size: 40px; margin-bottom: 30px; }
            .btn-join-now { width: 100%; box-sizing: border-box; font-size: 18px; padding: 15px; }
            .large-logo-img { width: 280px; }
        }
    </style>
</head>
<body>

    <!-- NAVIGĀCIJAS JOSLA (HEADER) -->
    <header>
        <div class="logo-left-container">
            <!-- 1. ATTĒLS: Mazais ūsu logo augšējā kreisajā stūrī -->
            <img src="https://cdn.discordapp.com/attachments/1480649338983284955/1531295004667019384/Mister_Niks_Oficialais_Logo_NOBG.png?ex=6a6b541b&is=6a6a029b&hm=1d5937d12cb2af8aaa2e066fc91e7bfc9a229914e1f1694fc4325d61a881fdc7&" alt="Logo" class="logo-small">
        </div>
        
        <nav>
            <a href="#jaunumi">Jaunumi</a>
            <a href="#atbalsts">Atbalsts</a>
            <a href="#ziedojums">Ziedojums</a>
            <a href="#noderigi">Noderīgi</a>
            <a href="#pasakumi">Pasākumi</a>
            <a href="#par-mums">Par Mums</a>
            <a href="#statuss">Statuss</a>
        </nav>
    </header>

    <!-- HERO SEKCIJA -->
    <main class="hero-container">
        
        <!-- Teksta puse -->
        <div class="hero-text-block">
            <h1 class="text-latviesu">Latviešu</h1>
            <div class="text-draudzigaka">DRAUDZĪGĀKĀ</div>
            <h2 class="text-komuna">Discord Komūna</h2>
            
            <!-- SAITE: Ieliec savu Discord ielūgumu starp pēdiņām href="" -->
            <a href="https://discord.gg" class="btn-join-now" target="_blank">Pievienoties Tagad!</a>
        </div>

        <!-- Attēla puse -->
        <div class="hero-image-block">
            <!-- 2. ATTĒLS: Lielais baltais ūsu logo labajā pusē -->
            <img src="https://cdn.discordapp.com/attachments/1480649338983284955/1532112791421321277/nc_priecigs.png?ex=6a6baaba&is=6a6a593a&hm=6956b90cc711c3a0f7cff4ea32a456022b27819957280ee4f5093405d7e794f8&" alt="Mister Niks Lielais Logo" class="large-logo-img">
        </div>

    </main>

</body>
</html>

</body>
</html>
