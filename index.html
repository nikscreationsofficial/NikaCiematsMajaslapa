<!DOCTYPE html>
<html lang="lv">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nika Ciemats | Discord Komūna</title>
    <style>
        body {
            background-color: #0f111a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #161925;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #23283d;
        }
        h1 { color: #5865F2; margin-bottom: 10px; }
        p { color: #a3a6b4; font-size: 18px; line-height: 1.6; }
        .btn {
            display: inline-block;
            background-color: #5865F2;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 25px;
            transition: 0.3s;
        }
        .btn:hover { background-color: #4752c4; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nika Ciemats</h1>
        <p>Latviešu draudzīgākā Discord komūna. Šeit mēs rīkojam spēļu vakarus, pasākumus un vienkārši labi pavadām laiku.</p>
        <p><i>Mājaslapa šobrīd tiek atjaunināta uz jaunu, jaudīgu sistēmu...</i></p>
        <a href="https://discord.gg" class="btn" target="_blank">Pievienoties Discord</a>
    </div>
</body>
</html>
