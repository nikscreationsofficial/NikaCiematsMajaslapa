!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lapa nav atrasta | 404</title>
    <style>
        body {
            background-color: #0f111a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 100px 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #161925;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #ff4757; /* Sarkana maliņa kļūdai */
        }
        h1 { color: #ff4757; font-size: 80px; margin: 0; }
        h2 { color: #ffffff; margin-top: 10px; }
        p { color: #a3a6b4; font-size: 16px; line-height: 1.6; }
        .btn {
            display: inline-block;
            background-color: #5865F2;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 25px;
            transition: 0.3s;
        }
        .btn:hover { background-color: #4752c4; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Lapa netika atrasta!</h2>
        <p>Izskatās, ka šāds ciemata stūrītis neeksistē vai arī esi apmaldījies tumsā. Nebēdā, dodies atpakaļ uz galveno laukumu.</p>
        <a href="https://github.io" class="btn">Atgriezties mājās</a>
    </div>
</body>
</html>
